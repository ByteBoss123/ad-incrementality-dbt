ad_measurement:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ad_measurement.duckdb
      threads: 4
    # Snowflake, key-pair login (recommended: trial accounts require MFA for passwords).
    # Env: SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PRIVATE_KEY_PATH. See snowflake/README.md.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'DBT_SVC') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'unset') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: ANALYTICS
      schema: DBT
      threads: 4
    # Snowflake, password login (only if your user has no MFA requirement).
    snowflake_password:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'unset') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'unset') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', 'unset') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: ANALYTICS
      schema: DBT
      threads: 4
