version: 2

models:
  - name: fct_ad_performance
    description: Ad-grain paid-media performance with efficiency metrics.
    columns:
      - name: ad_id
        data_tests: [unique, not_null]
      - name: campaign_id
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [916, 936, 1178]}
      - name: ctr
        description: Click-through rate = clicks / impressions.
        data_tests:
          - accepted_range: {arguments: {min_value: 0, max_value: 1}}
      - name: cpc_usd
        description: Cost per click = spend / clicks. Null when clicks = 0.
      - name: cpm_usd
        description: Cost per thousand impressions = spend * 1000 / impressions.
      - name: cost_per_approved_conversion_usd
        description: Spend / approved conversions. Null when no approved conversions.
      - name: approval_rate
        description: Approved conversions / total conversions.

  - name: agg_campaign_performance
    description: Campaign rollup; ratios computed as ratio of sums.
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]

  - name: agg_campaign_segment_performance
    description: Campaign x age band x gender rollup; ratios computed as ratio of sums.
    data_tests:
      - expression_is_true:
          arguments: {expression: "ads > 0"}

  - name: fct_cpa_drivers
    description: >
      Decomposes each campaign's CPA gap versus the lowest-CPA campaign into click cost (CPC)
      and click-to-conversion rate, using CPA = CPC x clicks per approved conversion.
    data_tests:
      - expression_is_true:
          arguments: {expression: "abs(cpa_usd - cpc_usd * clicks_per_approved_conversion) < 1e-6"}
      - expression_is_true:
          arguments: {expression: "cpc_share_of_gap is null or abs(cpc_share_of_gap + conversion_rate_share_of_gap - 1) < 1e-9"}
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]

  - name: fct_segment_cpa_drivers
    description: Campaign x age band spend share, conversion share and CPA.
    columns:
      - name: spend_share
        data_tests:
          - accepted_range: {arguments: {min_value: 0, max_value: 1}}
      - name: conversion_share
        data_tests:
          - accepted_range: {arguments: {min_value: 0, max_value: 1}}
